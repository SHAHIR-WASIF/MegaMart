<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="frostBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#154134"/>
      <stop offset="50%" stop-color="#1B4D3E"/>
      <stop offset="100%" stop-color="#0E2B22"/>
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="iceCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#frostBg)" stroke="url(#goldPlate)" stroke-width="2.5"/>

  <!-- Subtle Frost Ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Snowflake Accent (Top Left) -->
  <path d="M 18 18 L 22 22 M 20 17 L 20 23 M 17 20 L 23 20" stroke="#7DD3FC" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Snowflake Accent (Top Right) -->
  <path d="M 43 18 L 47 22 M 45 17 L 45 23 M 42 20 L 48 20" stroke="#7DD3FC" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Gourmet Cloche / Ready Dome Cover -->
  <path d="M 17 38 C 17 26, 23 23, 32 23 C 41 23, 47 26, 47 38 Z" fill="#F8FAFC" fill-opacity="0.95" stroke="url(#goldPlate)" stroke-width="1.5"/>

  <!-- Cloche Top Knob -->
  <circle cx="32" cy="21" r="2.5" fill="#F59E0B" stroke="#FDE68A" stroke-width="1"/>

  <!-- Cloche Base Plate / Serving Dish -->
  <path d="M 14 39 C 14 38, 15 37.5, 17 37.5 L 47 37.5 C 49 37.5, 50 38, 50 39 C 50 41.5, 46 44, 32 44 C 18 44, 14 41.5, 14 39 Z" fill="url(#goldPlate)"/>
  
  <!-- Ready & Fresh Steam Waves -->
  <path d="M 28 17 C 27 14, 29 12, 28 9" stroke="url(#steamGrad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 32 16 C 33 13, 31 11, 32 8" stroke="url(#steamGrad)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 36 17 C 37 14, 35 12, 36 9" stroke="url(#steamGrad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Cold/Ice Star in Center of Cloche -->
  <path d="M 32 28 L 33.2 31.8 L 37 33 L 33.2 34.2 L 32 38 L 30.8 34.2 L 27 33 L 30.8 31.8 Z" fill="url(#iceCyan)"/>

  <!-- Base Trim -->
  <rect x="22" y="44" width="20" height="2" rx="1" fill="#D97706"/>
</svg>
