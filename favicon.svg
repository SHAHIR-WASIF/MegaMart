<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D3E"/>
      <stop offset="100%" stop-color="#0E2E24"/>
    </linearGradient>
    <linearGradient id="jarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="chiliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldRing)" stroke-width="2.5"/>

  <!-- Glass Jar Body -->
  <path d="M 21 27 C 20 27, 19 28, 19 30 L 19 46 C 19 50, 22 53, 27 53 L 37 53 C 42 53, 45 50, 45 46 L 45 30 C 45 28, 44 27, 43 27 Z" fill="#FFFFFF" fill-opacity="0.18" stroke="#FDE68A" stroke-width="1.2"/>

  <!-- Rich Spice Pickling Oil in Jar -->
  <path d="M 20.5 34 C 23 35.5, 27 34, 32 35.5 C 37 37, 41 34.5, 43.5 35 L 43.5 46 C 43.5 49.5, 41 51.5, 37 51.5 L 27 51.5 C 23 51.5, 20.5 49.5, 20.5 46 Z" fill="url(#jarGlow)"/>

  <!-- Red Chili inside Achar -->
  <path d="M 29 48 C 30 46, 33 42, 35 39 C 36 37.5, 37 38.5, 36.5 40 C 35.5 43, 33 47, 30.5 49 C 29.5 49.5, 28.5 49, 29 48 Z" fill="url(#chiliGrad)"/>
  
  <!-- Tiny Spice seeds (Mustard/Panch Phoron) -->
  <circle cx="25" cy="45" r="1.2" fill="#FEF08A"/>
  <circle cx="38" cy="43" r="1.3" fill="#78350F"/>
  <circle cx="28" cy="38" r="1" fill="#FEF08A"/>
  <circle cx="34" cy="46" r="1.1" fill="#FEF08A"/>

  <!-- Jar Neck & Lid -->
  <rect x="23" y="23" width="18" height="4.5" rx="1.5" fill="#FAF5EF" stroke="#D97706" stroke-width="1"/>
  <rect x="21.5" y="18.5" width="21" height="5" rx="2" fill="#D97706" stroke="#FEF3C7" stroke-width="1"/>
  
  <!-- Twine Tie string on Lid -->
  <line x1="22" y1="24.5" x2="42" y2="24.5" stroke="#92400E" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 39 25 C 41 27, 43 28, 43 30" stroke="#FDE68A" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Subtle Light Reflection -->
  <path d="M 22 30 L 22 47" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
</svg>
